<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="setAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="setBGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stage1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stage2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="1100" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="bold">TieredRAG Architecture</text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-size="13">Confidence-Gated Context Recovery for Cost-Efficient Long-Document RAG</text>

  <!-- Step 1: Document + Query -->
  <rect x="300" y="95" width="300" height="60" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="120" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">📄 100-Page Document + User Query</text>
  <text x="450" y="140" text-anchor="middle" fill="#94a3b8" font-size="11">~200 chunks (256 tokens each)</text>

  <!-- Arrow down -->
  <path d="M 450 155 L 450 185" stroke="#64748b" stroke-width="2" marker-end="url(#arrowGray)"/>
  <defs><marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b"/></marker></defs>

  <!-- Step 2: Scoring -->
  <rect x="275" y="185" width="350" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="210" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">🔍 Hybrid Scoring (BM25 + Dense)</text>
  <text x="450" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">Score = 0.5 × BM25 + 0.5 × Embedding Similarity</text>
  <text x="450" y="247" text-anchor="middle" fill="#94a3b8" font-size="11">Rank all chunks by relevance to query</text>

  <!-- Arrow splitting into two -->
  <path d="M 450 255 L 450 280" stroke="#64748b" stroke-width="2"/>
  <path d="M 450 280 L 300 310" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 450 280 L 600 310" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#10b981"/></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#f59e0b"/></marker>
  </defs>

  <!-- Set A -->
  <rect x="170" y="315" width="250" height="80" rx="10" fill="url(#setAGrad)" filter="url(#shadow)"/>
  <text x="295" y="342" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SET A — Essential</text>
  <text x="295" y="362" text-anchor="middle" fill="#d1fae5" font-size="12">Top 20% chunks (highest scores)</text>
  <text x="295" y="382" text-anchor="middle" fill="#d1fae5" font-size="12">~40 chunks → Sent to LLM first</text>

  <!-- Set B -->
  <rect x="480" y="315" width="250" height="80" rx="10" fill="url(#setBGrad)" filter="url(#shadow)"/>
  <text x="605" y="342" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">SET B — Standby</text>
  <text x="605" y="362" text-anchor="middle" fill="#fef3c7" font-size="12">Bottom 80% chunks (lower scores)</text>
  <text x="605" y="382" text-anchor="middle" fill="#fef3c7" font-size="12">~160 chunks → Waiting Room 🕐</text>

  <!-- NOT DELETED label for Set B -->
  <rect x="530" y="400" width="150" height="22" rx="5" fill="#7c2d12"/>
  <text x="605" y="415" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">⚠️ NOT DELETED — PRESERVED</text>

  <!-- Arrow from Set A to Stage 1 -->
  <path d="M 295 395 L 295 460" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Stage 1 -->
  <rect x="170" y="465" width="250" height="80" rx="10" fill="url(#stage1Grad)" filter="url(#shadow)"/>
  <text x="295" y="492" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">⚡ STAGE 1 — Fast Pass</text>
  <text x="295" y="512" text-anchor="middle" fill="#bfdbfe" font-size="12">GPT-4o-mini (cheap model)</text>
  <text x="295" y="532" text-anchor="middle" fill="#bfdbfe" font-size="12">Reads only Set A → Cost: $0.05</text>

  <!-- Arrow from Stage 1 to Confidence Gate -->
  <path d="M 295 545 L 295 590" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#3b82f6"/></marker></defs>

  <!-- Confidence Gate -->
  <rect x="150" y="595" width="600" height="110" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="620" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="bold">🛡️ CONFIDENCE GATE — Triple Verification</text>

  <!-- Three signals -->
  <rect x="175" y="635" width="170" height="50" rx="8" fill="#312e81"/>
  <text x="260" y="655" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">Signal 1</text>
  <text x="260" y="673" text-anchor="middle" fill="#c7d2fe" font-size="10">LLM-as-Judge</text>

  <rect x="365" y="635" width="170" height="50" rx="8" fill="#312e81"/>
  <text x="450" y="655" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">Signal 2</text>
  <text x="450" y="673" text-anchor="middle" fill="#c7d2fe" font-size="10">Self-Consistency</text>

  <rect x="555" y="635" width="170" height="50" rx="8" fill="#312e81"/>
  <text x="640" y="655" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="bold">Signal 3</text>
  <text x="640" y="673" text-anchor="middle" fill="#c7d2fe" font-size="10">Uncertainty Check</text>

  <!-- Decision arrows -->
  <text x="450" y="725" text-anchor="middle" fill="#94a3b8" font-size="12">All 3 Pass?</text>

  <!-- YES path (left) -->
  <path d="M 350 730 L 230 770" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="270" y="750" text-anchor="middle" fill="#10b981" font-size="12" font-weight="bold">YES ✓</text>

  <!-- NO path (right) -->
  <path d="M 550 730 L 650 770" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="620" y="750" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="bold">NO ✗</text>
  <defs><marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#ef4444"/></marker></defs>

  <!-- Output (Confident) -->
  <rect x="130" y="775" width="220" height="70" rx="10" fill="#065f46" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="240" y="800" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">✅ OUTPUT ANSWER</text>
  <text x="240" y="820" text-anchor="middle" fill="#6ee7b7" font-size="12">Cost: $0.05 only</text>
  <text x="240" y="837" text-anchor="middle" fill="#6ee7b7" font-size="11">Set B stays untouched</text>

  <!-- Recovery arrow from Set B to Stage 2 -->
  <path d="M 605 422 L 605 450 L 700 450 L 700 780" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowAmber)"/>
  <text x="740" y="620" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold" transform="rotate(90 740 620)">RECOVERY PATH</text>

  <!-- Stage 2 -->
  <rect x="530" y="775" width="250" height="90" rx="10" fill="url(#stage2Grad)" filter="url(#shadow)"/>
  <text x="655" y="800" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🔥 STAGE 2 — Full Pass</text>
  <text x="655" y="820" text-anchor="middle" fill="#fecaca" font-size="12">GPT-4o (strong model)</text>
  <text x="655" y="838" text-anchor="middle" fill="#fecaca" font-size="12">Reads Set A + Set B (all pages)</text>
  <text x="655" y="856" text-anchor="middle" fill="#fecaca" font-size="12">Cost: $1.05 total</text>

  <!-- Stage 2 Output -->
  <path d="M 655 865 L 655 910" stroke="#ef4444" stroke-width="2" marker-end="url(#arrowRed)"/>
  <rect x="530" y="915" width="250" height="50" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="655" y="937" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">✅ CORRECT ANSWER</text>
  <text x="655" y="955" text-anchor="middle" fill="#fca5a5" font-size="11">Nothing lost — 100% context</text>

  <!-- Key insight box -->
  <rect x="100" y="1000" width="700" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="450" y="1025" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">💡 KEY INSIGHT</text>
  <text x="450" y="1048" text-anchor="middle" fill="#cbd5e1" font-size="12">Easy questions (70% of traffic): Only Stage 1 fires → $0.05 per query</text>
  <text x="450" y="1068" text-anchor="middle" fill="#cbd5e1" font-size="12">Hard questions (15% of traffic): Both stages fire → $1.05 per query, but always correct</text>
</svg>
